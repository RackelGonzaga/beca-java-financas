spring.application.name=ms2-transactions

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${TRANSACTIONS_DB:financas}
spring.datasource.username=${POSTGRES_USER:usuario_dev}
spring.datasource.password=${POSTGRES_PASSWORD:}

mockapi.base-url=${MOCKAPI_BASE_URL}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

ms1.users.base-url=${MS1_USERS_BASE_URL:http://localhost:8080}