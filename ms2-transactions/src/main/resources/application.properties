spring.application.name=ms2-transactions

spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5433/${TRANSACTIONS_DB:transactions}
spring.datasource.username=${POSTGRES_USER:usuario_dev}
spring.datasource.password=${POSTGRES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
ms1.users.base-url=http://localhost:8080